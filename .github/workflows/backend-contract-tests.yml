name: Backend Contract Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-contract-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-contract-tests.yml"

jobs:
  processor-contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Django==5.0.2 beautifulsoup4==4.12.3

      - name: Run processor contract tests
        run: |
          python manage.py test apps.content.processor.tests --settings=dailybrief.settings_test_contract --verbosity 2

