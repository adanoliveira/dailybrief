version: '3.8'

services:
  # Database with pgvector extension
  db:
    image: pgvector/pgvector:pg15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_PASSWORD=${SUPABASE_DB_PASSWORD:-postgres}
      - POSTGRES_USER=${SUPABASE_DB_USER:-postgres}
      - POSTGRES_DB=${SUPABASE_DB_NAME:-dailybrief}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (for Celery)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build: 
      context: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-replace-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
      - SUPABASE_DB_NAME=${SUPABASE_DB_NAME:-dailybrief}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER:-postgres}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD:-postgres}
      - SUPABASE_DB_HOST=db
      - SUPABASE_DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
    command: sh -c "cd /app && PYTHONPATH=/app celery -A dailybrief worker --loglevel=info"
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-replace-in-production
      - SUPABASE_DB_NAME=${SUPABASE_DB_NAME:-dailybrief}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER:-postgres}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD:-postgres}
      - SUPABASE_DB_HOST=db
      - SUPABASE_DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

  # Celery Beat (for scheduled tasks)
  celery_beat:
    build:
      context: ./backend
    command: sh -c "cd /app && PYTHONPATH=/app celery -A dailybrief beat --loglevel=info"
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-replace-in-production
      - SUPABASE_DB_NAME=${SUPABASE_DB_NAME:-dailybrief}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER:-postgres}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD:-postgres}
      - SUPABASE_DB_HOST=db
      - SUPABASE_DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

  # Celery Flower (for task monitoring)
  flower:
    build:
      context: ./backend
    command: sh -c "cd /app && PYTHONPATH=/app celery -A dailybrief flower --port=5555 --broker=redis://redis:6379/0"
    ports:
      - "5555:5555"
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - celery_worker
      - celery_beat
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-replace-in-production
      - SUPABASE_DB_NAME=${SUPABASE_DB_NAME:-dailybrief}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER:-postgres}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD:-postgres}
      - SUPABASE_DB_HOST=db
      - SUPABASE_DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  # Next.js Frontend
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: dailybrief-frontend
    command: npm run dev
    restart: on-failure:3
    volumes:
      - ./frontend:/app
      # Use anonymous volumes for node_modules and build directories
      - /app/node_modules
      - /app/.next
      - /app/src/generated
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-nextauth-secret-replace-in-production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/dailybrief?schema=auth
      # Google OAuth configuration
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # Email configuration
      - EMAIL_FROM=${EMAIL_FROM:-dailybrief@resend.dev}
      - RESEND_API_KEY=${RESEND_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - db

volumes:
  postgres_data:
  redis_data:
  backend_static: 